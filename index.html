/* Layout: each sector = section with sticky background + flow of panels (media 60% / text 40%, sides alternate) */
:root {
  --ink: #111111;
  --concrete: #2a2a28;
  --concrete-hi: #4a4a46;
  --paper: #F1F0EA;
  --mute: #a9a79f;
  --red: #C9272C;
  --f-display: "Avant Garde Bold", "ITC Avant Garde Gothic", "Century Gothic", "Futura", sans-serif;
  --f-sub: "Interstate", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-mono: "Interstate Comp", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Basic Commercial", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --hh: 56px;
  --gutter: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-snap-type: y mandatory; }
/* вся страница = слайды; внутри сектора фон общий, меняется только содержимое */
.slide { position: relative; min-height: 100svh; scroll-snap-align: start; scroll-snap-stop: always; }
footer { scroll-snap-align: end; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body { margin: 0; background: var(--ink); color: var(--paper); font: 400 18px/1.6 var(--f-body); overflow-x: hidden; }
@media (min-width: 1024px) { body { font-size: 19px; } }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--ink); }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 3px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; text-transform: uppercase; line-height: 1.04; letter-spacing: 0; text-wrap: balance; margin: 0; overflow-wrap: normal; word-break: normal; hyphens: none; }
.mono { font-family: var(--f-mono); font-size: 15px; letter-spacing: .06em; text-transform: uppercase; }

/* ---------- header ---------- */
.hdr { position: fixed; top: env(safe-area-inset-top, 0px); left: 0; right: 0; z-index: 50; height: var(--hh);
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding-left: var(--gutter); padding-right: var(--gutter-r);
  background: rgba(17,17,17,.88); backdrop-filter: blur(8px); border-bottom: 1px solid rgba(241,240,234,.12); }
.brand { display: inline-flex; align-items: center; color: var(--paper); text-decoration: none; flex: none; }
.brand { gap: 10px; }
.brand-mark { display: block; width: 22px; height: 19px; overflow: visible; color: var(--red); }
.brand-logo { display: block; height: 15px; width: auto; }
@media (max-width: 480px) { .brand-logo { height: 13px; } .brand-mark { width: 19px; height: 16px; } .brand { gap: 8px; } }
.brand b { color: var(--red); font-weight: 700; }
.nav { display: flex; gap: 4px; }
.nav a { font-family: var(--f-mono); font-size: 15px; letter-spacing: .08em; text-transform: uppercase; text-decoration: none; padding: 8px 10px; color: var(--mute); border-bottom: 2px solid transparent; }
.nav a:hover { color: var(--paper); }
.nav a.on { color: var(--paper); border-bottom-color: var(--red); }
.nav-item { position: relative; display: flex; flex-direction: column; }
.sub { position: absolute; top: 100%; left: 0; min-width: 280px; display: none; flex-direction: column; background: var(--ink); border: 1px solid rgba(241,240,234,.15); border-top: 2px solid var(--red); padding: 6px 0; }
.nav-item:hover .sub, .nav-item:focus-within .sub { display: flex; }
.nav .sub a { color: var(--mute); padding: 9px 16px; border: 0; text-transform: none; letter-spacing: .02em; white-space: nowrap; }
.nav .sub a:hover, .nav .sub a:focus-visible { color: var(--paper); background: rgba(241,240,234,.06); }
.nav .sub b { color: var(--red); font-weight: 400; margin-right: 6px; }
body.astral-on .sub { background: var(--paper); border-color: rgba(17,17,17,.15); }
body.astral-on .nav .sub a:hover { color: var(--ink); background: rgba(17,17,17,.05); }
.menu-btn { display: none; background: none; border: 1px solid rgba(241,240,234,.3); color: var(--paper); font: 400 15px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; padding: 8px 12px; cursor: pointer; }
@media (max-width: 900px) {
  .menu-btn { display: block; }
  .nav { position: absolute; top: var(--hh); left: 0; right: 0; flex-direction: column; gap: 0; background: var(--ink); border-bottom: 1px solid rgba(241,240,234,.15); padding: 8px var(--gutter-r) 12px var(--gutter); }
  .nav:not(.open) { display: none; }
  .nav a { padding: 12px 4px; font-size: 17px; border-bottom: 1px solid rgba(241,240,234,.08); }
  .nav { max-height: calc(100svh - var(--hh)); overflow-y: auto; }
  .sub { position: static; display: flex; min-width: 0; border: 0; padding: 0 0 6px 14px; background: none; }
  .nav .sub a { font-size: 15px; padding: 8px 4px; white-space: normal; }
  .nav a.on { color: var(--red); border-bottom-color: rgba(241,240,234,.08); }
}
/* шапка на Астрале */
body.astral-on .hdr { background: rgba(241,240,234,.92); color: var(--ink); border-bottom-color: rgba(17,17,17,.15); }
body.astral-on .brand { color: var(--ink); }
body.astral-on .nav a { color: #55544f; }
body.astral-on .nav a.on, body.astral-on .nav a:hover { color: var(--ink); }
body.astral-on .menu-btn { color: var(--ink); border-color: rgba(17,17,17,.35); }
@media (max-width: 900px) { body.astral-on .nav { background: var(--paper); } }

.btn { display: inline-flex; align-items: center; gap: 12px; font: 700 17px var(--f-sub); letter-spacing: .1em; text-transform: uppercase; text-decoration: none; padding: 16px 26px; background: var(--red); color: var(--paper); border: 1px solid var(--red); cursor: pointer; transition: background .2s; }
.btn:hover { background: #a91f24; }
.btn.ghost { background: transparent; color: inherit; border-color: currentColor; }
.btn.ghost:hover { background: rgba(127,127,127,.12); }

/* ---------- sector ---------- */
.sector { position: relative; }
.sector-bg { position: sticky; top: 0; height: 100svh; margin-bottom: -100svh; z-index: 0; overflow: hidden; }
.sector-bg .media { position: absolute; inset: 0; aspect-ratio: auto; height: 100%; }
.sector-bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(17,17,17,.7) 0%, rgba(17,17,17,.35) 55%, rgba(17,17,17,.55) 100%); pointer-events: none; }
.sector > .flow { position: relative; z-index: 1; }
.intro { min-height: 100svh; display: flex; align-items: center; max-width: 1360px; margin: 0 auto; padding: 96px var(--gutter-r) 96px var(--gutter); }
.intro-in { max-width: 760px; display: grid; gap: 22px; }
.eyebrow { display: flex; align-items: center; gap: 14px; color: var(--mute); }
.eyebrow .no { color: var(--red); font-weight: 500; }
.eyebrow::after { content: ""; flex: 1; max-width: 120px; height: 1px; background: currentColor; opacity: .5; }
.intro h2 { font-size: clamp(32px, 5.2vw, 78px); }
.intro p { margin: 0; max-width: 56ch; font-size: 1.05em; background: rgba(17,17,17,.6); padding: 16px 20px; border-left: 2px solid var(--red); }

.panel { display: flex; align-items: center; padding-top: calc(var(--hh) + 24px); padding-bottom: 96px; }
.panel-in { width: 100%; max-width: 1360px; margin: 0 auto; padding-left: var(--gutter); padding-right: var(--gutter-r);
  display: grid; grid-template-columns: minmax(0, 60fr) minmax(0, 40fr); gap: clamp(24px, 4vw, 64px); align-items: center; }
.panel.flip .panel-in { grid-template-columns: minmax(0, 40fr) minmax(0, 60fr); }
.panel.flip .figure { order: 2; }
.panel.wide .panel-in { grid-template-columns: minmax(0, 1fr); }
.panel.wide .text { max-width: 760px; }
.figure { margin: 0; min-width: 0; display: grid; gap: 10px; }
.text { min-width: 0; background: rgba(17,17,17,.84); padding: clamp(20px, 2.6vw, 36px); display: grid; gap: 16px; border-top: 2px solid var(--red); }
.text .idx { display: flex; justify-content: space-between; gap: 12px; color: var(--mute); }
.text .idx b { color: var(--red); font-weight: 500; }
.text h3 { font-family: var(--f-sub); font-size: clamp(32px, 3.6vw, 54px); line-height: 1; }
.text p { margin: 0; max-width: 60ch; }
.text .cap { color: var(--mute); border-top: 1px solid rgba(241,240,234,.15); padding-top: 12px; line-height: 1.6; }

/* media */
.media { position: relative; width: 100%; max-width: 100%; aspect-ratio: 16 / 10; background: #1b1b1a; overflow: hidden; }
.media.tall { aspect-ratio: 4 / 3; }
.panel.wide .media { aspect-ratio: auto; height: min(52svh, 42vw); }
.media img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.media.contain { background: #1e1e1c; }
.media button.zoom { position: absolute; inset: 0; background: none; border: 0; padding: 0; cursor: zoom-in; }
.ph { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 16px 18px;
  background:
    repeating-linear-gradient(90deg, rgba(241,240,234,.045) 0 1px, transparent 1px 72px),
    repeating-linear-gradient(0deg, rgba(241,240,234,.03) 0 1px, transparent 1px 72px),
    linear-gradient(160deg, #343431, #1c1c1a 70%);
  color: var(--mute); }
.ph .code { color: var(--red); }
.ph .need { font-family: var(--f-sub); font-weight: 700; text-transform: uppercase; font-size: clamp(16px, 1.6vw, 22px); letter-spacing: .03em; color: #cfcdc5; max-width: 30ch; line-height: 1.15; }
.ph .src { font-family: var(--f-mono); font-size: 13px; opacity: .7; overflow-wrap: anywhere; }
.figcap { display: flex; justify-content: space-between; align-items: center; gap: 12px; color: var(--mute); }
.gal { display: flex; gap: 6px; }
.gal button { width: 36px; height: 36px; background: rgba(17,17,17,.7); border: 1px solid rgba(241,240,234,.3); color: var(--paper); cursor: pointer; font: 16px var(--f-mono); }

/* sector bg tones (placeholder look per sector) */
.tone-executive .ph { background: repeating-linear-gradient(90deg, rgba(241,240,234,.05) 0 1px, transparent 1px 120px), linear-gradient(180deg, #2c2b28, #121211); }
.tone-maintenance .ph { background: repeating-linear-gradient(0deg, rgba(241,240,234,.05) 0 2px, transparent 2px 90px), radial-gradient(ellipse at 50% 40%, #3a3328, #121110 70%); }
.tone-research .ph { background: repeating-linear-gradient(90deg, rgba(241,240,234,.04) 0 1px, transparent 1px 96px), radial-gradient(ellipse at 40% 70%, #26302a, #111312 70%); }
.tone-containment .ph { background: repeating-linear-gradient(90deg, rgba(241,240,234,.05) 0 1px, transparent 1px 48px), repeating-linear-gradient(0deg, rgba(241,240,234,.04) 0 1px, transparent 1px 64px), linear-gradient(180deg, #23262a, #0f1012); }
.sector-bg .ph { justify-content: flex-end; align-items: flex-end; text-align: right; padding: 24px var(--gutter-r) 24px var(--gutter); }

/* ---------- astral (светлый) ---------- */
.astral { color: var(--ink); background: var(--paper); }
.astral .sector-bg::after { background: linear-gradient(90deg, rgba(241,240,234,.75), rgba(241,240,234,.2) 60%, rgba(241,240,234,.4)); }
.astral .ph { background: #f7f6f1; color: #6d6c66; }
.astral .ph .need { color: #2b2b29; }
.astral .ph::before { content: ""; position: absolute; left: 50%; top: 14%; width: min(30%, 260px); aspect-ratio: 1 / .8; transform: translateX(-50%); background: var(--ink); clip-path: polygon(0 0, 100% 0, 50% 100%); }
.astral .media { background: #f7f6f1; }
.astral .intro p { background: rgba(241,240,234,.8); }
.astral .text { background: rgba(255,255,255,.92); color: var(--ink); }
.astral .text .idx, .astral .text .cap, .astral .eyebrow, .astral .figcap { color: #5a5953; }
.astral .text .cap { border-top-color: rgba(17,17,17,.15); }
.astral .gal button { background: #fff; color: var(--ink); border-color: rgba(17,17,17,.3); }
.finale { z-index: 1; max-width: 1360px; margin: 0 auto; padding: calc(var(--hh) + 24px) var(--gutter-r) 96px var(--gutter); display: grid; gap: 24px; align-content: center; }
.finale h2 { font-size: clamp(32px, 5.6vw, 88px); max-width: 16ch; }
.finale p { margin: 0; max-width: 52ch; font-size: 1.05em; }
.finale .cta { font-family: var(--f-sub); font-weight: 700; text-transform: uppercase; font-size: clamp(20px, 2.4vw, 28px); letter-spacing: .04em; }
.finale .btns { display: flex; flex-wrap: wrap; gap: 12px; }


/* ---------- title card (как заставка сектора в игре) ---------- */
.card { position: relative; min-height: 100svh; display: flex; align-items: center; justify-content: center; text-align: center;
  padding: calc(var(--hh) + 24px) var(--gutter-r) 96px var(--gutter); }
.card-title { font-size: clamp(40px, 12vw, 240px); line-height: .9; color: var(--paper); text-wrap: balance; overflow-wrap: normal; hyphens: none;
  text-shadow: 0 2px 30px rgba(0,0,0,.35); max-width: 100%; }
.astral .card-title { color: var(--ink); text-shadow: none; }
.cue { position: absolute; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); padding: 14px; display: block; }
.cue span, .tri { display: block; width: 34px; height: 26px; background: var(--paper); clip-path: polygon(0 0, 100% 0, 50% 100%); }
.astral .cue span { background: var(--ink); }
.cue span { animation: cue 1.8s ease-in-out infinite; }
@keyframes cue { 0%, 100% { opacity: .45; transform: translateY(0); } 50% { opacity: 1; transform: translateY(7px); } }
@media (prefers-reduced-motion: reduce) { .cue span { animation: none; } }
.tri { display: inline-block; width: 14px; height: 10px; }
.intro-row { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 24px; margin-top: 6px; }
.intro .warn { color: var(--paper); }
.intro .warn::before { content: "■ "; color: var(--red); }

.seal { width: min(400px, 30vw); height: auto; flex: none; margin-left: auto; opacity: .92; filter: drop-shadow(0 4px 30px rgba(0,0,0,.5)); }
.intro { gap: clamp(24px, 5vw, 80px); }
@media (max-width: 860px) { .intro:has(.seal) { flex-direction: column; justify-content: center; align-items: flex-start; } .seal { width: 128px; margin-left: 0; order: -1; } }
.seal.map { width: min(600px, 40vw, calc(100svh - var(--hh) - 140px)); height: auto; aspect-ratio: 1; max-height: none; object-fit: contain; filter: drop-shadow(0 6px 30px rgba(0,0,0,.6)); }
@media (max-width: 860px) { .seal.map { width: min(300px, 70vw, 34svh); } }
.slide-bg { position: absolute; inset: 0; background: center / cover no-repeat; z-index: 0; overflow: hidden; } /* zoomed layers stay inside: no extra scroll */
.slide-bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(17,17,17,.45), rgba(17,17,17,.25) 40%, rgba(17,17,17,.6)); }
.panel.has-bg .panel-in, .card.has-bg .card-title { position: relative; z-index: 1; }
.has-bg .cue { z-index: 2; }
.slide-bg.full { left: 50%; right: auto; width: 100vw; transform: translateX(-50%); }
.intro.has-bg > *:not(.slide-bg):not(.cue) { position: relative; z-index: 1; }
.panel.has-bg .cue { z-index: 2; }
.slide-bg.full { left: 50%; right: auto; width: 100vw; transform: translateX(-50%); }
.intro.has-bg > *:not(.slide-bg):not(.cue) { position: relative; z-index: 1; }
/* ---------- counter ---------- */
.counter { position: fixed; z-index: 40; left: var(--gutter); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  background: rgba(17,17,17,.88); border-left: 2px solid var(--red); padding: 8px 14px; display: flex; gap: 14px; color: var(--paper); transition: opacity .25s; }
.counter[hidden] { display: none !important; }
.counter .n { color: var(--red); font-variant-numeric: tabular-nums; }
body.astral-on .counter { background: rgba(255,255,255,.95); color: var(--ink); }

/* ---------- footer ---------- */
footer { border-top: 1px solid rgba(241,240,234,.12); padding-block: 40px 56px; padding-left: var(--gutter); padding-right: var(--gutter-r); color: var(--mute); font-size: 15px; }
footer .in { max-width: 1360px; margin: 0 auto; display: grid; gap: 18px; }
footer p { margin: 0; max-width: 70ch; }
footer details summary { cursor: pointer; color: var(--paper); font-family: var(--f-mono); font-size: 15px; letter-spacing: .06em; text-transform: uppercase; }
footer ul { columns: 2 260px; padding-left: 18px; margin: 14px 0 0; font-size: 14px; }

/* ---------- lightbox ---------- */
.lb { position: fixed; inset: 0; z-index: 80; background: rgba(10,10,10,.94); display: flex; align-items: center; justify-content: center; padding: 64px var(--gutter-r) 32px var(--gutter); }
.lb img { max-width: 100%; max-height: 100%; object-fit: contain; }
.lb button { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: var(--gutter-r); }

/* ---------- reveal (только если JS включил .armed) ---------- */
.armed .panel .figure { opacity: 0; transform: translateX(-40px); transition: opacity .6s ease, transform .6s cubic-bezier(.2,.7,.2,1); }
.armed .panel.flip .figure { transform: translateX(40px); }
.armed .panel .text { opacity: 0; transform: translateY(20px); transition: opacity .55s ease .15s, transform .55s cubic-bezier(.2,.7,.2,1) .15s; }
.armed .panel.wide .figure { transform: translateY(32px); }
.armed .panel.in .figure, .armed .panel.in .text { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) { .armed .panel .figure, .armed .panel .text { opacity: 1 !important; transform: none !important; transition: none !important; } }

/* ---------- narrow ---------- */
@media (max-width: 860px) {
  .panel { padding-top: calc(var(--hh) + 16px); padding-bottom: 88px; }
  .panel-in, .panel.flip .panel-in { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .panel.flip .figure { order: 0; }
  .panel.wide .media, .media { aspect-ratio: 4 / 3; height: auto; }
  .text { border-top: 0; }
  .figcap { padding: 8px 0; }
  .sector-bg::after { background: rgba(17,17,17,.55); }
  .astral .sector-bg::after { background: rgba(241,240,234,.55); }
  .counter { left: auto; right: var(--gutter-r); }
}
@media (max-width: 480px) { body { font-size: 17px; } }

/* ================= HUD-стиль по интерфейсу Control ================= */
:root { --panel: rgba(16,16,16,.8); --line: rgba(241,240,234,.16); --tab: #e6e5e0; --gold: #F2D21B; --badge: #2b2b2a; }
/* вкладки меню */
.nav { align-items: center; gap: 0; }
.nav > a, .nav-item > a { padding: 6px 14px; border: 0; border-left: 1px solid var(--line); color: #9d9c96; }
.nav > a:first-of-type { border-left: 0; }
.nav a.on { background: var(--tab); color: var(--ink) !important; border-left-color: transparent; }
.nav a:hover:not(.on) { color: var(--paper); }
.key { font: 600 12px var(--f-body); color: var(--ink); background: var(--tab); min-width: 22px; height: 22px; display: inline-grid; place-items: center; margin: 0 10px; }
.sub { background: var(--panel); backdrop-filter: blur(6px); border: 1px solid var(--line); padding: 0; }
.nav .sub a { border-top: 1px solid var(--line); padding: 10px 16px; color: #bdbcb5; }
.nav .sub a:first-child { border-top: 0; }
.nav .sub a:hover { background: var(--tab); color: var(--ink); }
.nav .sub b { color: var(--red); }
.nav .sub a:hover b { color: var(--red); }
body.astral-on .nav > a, body.astral-on .nav-item > a { border-left-color: rgba(17,17,17,.15); color: #5a5953; }
body.astral-on .nav a.on { background: var(--ink); color: var(--paper) !important; }
body.astral-on .key { background: var(--ink); color: var(--paper); }
@media (max-width: 900px) {
  .key { display: none; }
  .nav > a, .nav-item > a { border-left: 0; padding: 12px 8px; }

/* кнопки */

/* подсказка-пирамида: маркер из интерфейса */

/* ================= Deck (desktop slides) + Interlude layer + Motion Lab ================= */
:root { --interlude-color: #111111; --color-accent: var(--red); --color-bg: var(--paper); --font-mono: var(--f-mono); }

/* a scrolling slide clips what overflows it: in the deck, intro and finale span the screen and centre their content with padding instead */
.deck-stage .intro, .deck-stage .finale { max-width: none; margin: 0;
  padding-left: max(var(--gutter), calc((100% - 1360px) / 2 + 16px)); padding-right: max(var(--gutter-r), calc((100% - 1360px) / 2 + 16px)); }

footer { padding-left: 0; padding-right: 0; border-top-color: var(--line); }

/* Motion Lab */
.mlab-btn { position: fixed; z-index: 1100; left: max(20px, env(safe-area-inset-left, 0px)); bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  font: 400 15px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; padding: 8px 14px; cursor: pointer;
  background: var(--panel); color: var(--paper); border: 1px solid var(--line); backdrop-filter: blur(6px); }

  width: min(440px, calc(100vw - 40px)); max-height: calc(100vh - 140px); display: flex; flex-direction: column;

.mlab-grid { display: flex; flex-wrap: wrap; gap: 4px; }

@media (max-width: 860px) {

/* first screen: slow zoom, and the glitch with the video under it */
.home-nightmare { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; background: #000; }

/* title cards: background zoom box (title-zoom.ts) */

}

  width: 3px; height: min(120px, 17svh); background: rgba(241,240,234,.28); overflow: hidden; pointer-events: none; }

.car-arrow.next { right: 12px; } .car-arrow.next::before { border-left: 22px solid currentColor; }

@media (max-width: 900px) {
  .carousel { justify-content: flex-start; padding: calc(var(--hh) + 12px) 0 64px; }

const el = (tag, cls, html) => { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function placeholder(m) {
  const p = el("div", "ph");
  p.innerHTML = `<span class="mono code">${esc(m.code)} · ${UI.noImage}</span><span class="need">${esc(m.need)}</span><span class="src">${esc(m.sourcePage.replace("https://", ""))}</span>`;

}
function mediaBox(code, { tall = false, eager = false, zoom = true } = {}) {
  const m = MEDIA[code];
  const box = el("div", "media" + (tall ? " tall" : "") + (m.fit === "contain" ? " contain" : ""));
  if (!m.src) { box.append(placeholder(m)); return box; }
  const img = new Image();

  img.loading = eager ? "eager" : "lazy";

  img.onerror = () => { img.onerror = null; img.remove(); box.querySelector(".zoom")?.remove(); box.append(placeholder(m)); };
  img.src = m.src;
  box.append(img);
  if (zoom) { const b = el("button", "zoom"); b.setAttribute("aria-label", UI.open + m.alt); b.onclick = () => openLB(m); box.append(b); }
  return box;
}

function figure(item) {
  const fig = el("figure", "figure");
  let i = 0;
  const contain = MEDIA[item.media[0]].fit === "contain";
  const holder = el("div"); holder.append(mediaBox(item.media[0], { tall: contain }));
  fig.append(holder);
  const cap = el("figcaption", "figcap mono");
  const lab = el("span", "", esc(item.media[0])); cap.append(lab);
  if (item.media.length > 1) {
    const g = el("div", "gal");
    const go = d => { i = (i + d + item.media.length) % item.media.length; holder.replaceChildren(mediaBox(item.media[i], { tall: contain })); lab.textContent = `${item.media[i]} · ${i + 1}/${item.media.length}`; };
    const prev = el("button", "", "←"); prev.setAttribute("aria-label", UI.prev); prev.onclick = () => go(-1);
    const next = el("button", "", "→"); next.setAttribute("aria-label", UI.next); next.onclick = () => go(1);
    g.append(prev, next); cap.append(g); lab.textContent = `${item.media[0]} · 1/${item.media.length}`;
  }
  fig.append(cap);
  return fig;
}

function kv(cap) {

}

      const n = String(k + 1).padStart(2, "0");
      inner.append(el("div", "text", `

/* подгон заголовков-заставок: самое длинное слово занимает ширину экрана */
function fitTitles() {
  const c = fitTitles.c || (fitTitles.c = document.createElement("canvas").getContext("2d"));
  const fam = getComputedStyle(document.documentElement).getPropertyValue("--f-display");
  c.font = "700 100px " + fam;
  const w = t => c.measureText(t.toUpperCase()).width;
  document.querySelectorAll(".card-title").forEach(h => {
    const box = h.parentElement, cs = getComputedStyle(box);
    const avail = box.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    if (avail <= 0) return;
    const first = h.querySelector(".l1")?.textContent || "";
    // the second line: the last word, or the widest word it is retyped to
    const lasts = [h.querySelector(".l2")?.textContent || ""].concat(h.dataset.words ? h.dataset.words.split(" ") : []);
    const line2 = Math.max(...lasts.map(w));
    const two = Math.min(avail * 0.97 / Math.max(w(first), line2) * 100, innerHeight * 0.3, 260);
    const longest = Math.max(line2, ...first.split(/\s+/).map(w));
    const three = Math.min(avail * 0.97 / longest * 100, innerHeight * 0.22, 260);
    // two lines unless that would make the type much smaller than three lines allow
    const useTwo = !first.includes(" ") || two >= three * 0.72;
    h.classList.toggle("three", !useTwo);
    h.style.fontSize = Math.max(28, Math.floor(useTwo ? two : three)) + "px";
  });
}
fitTitles(); document.fonts?.ready.then(fitTitles); addEventListener("resize", fitTitles);

/* lightbox */
let lbEl = null, lbReturn = null;
function openLB(m) {

  lbEl = el("div", "lb"); lbEl.setAttribute("role", "dialog"); lbEl.setAttribute("aria-modal", "true"); lbEl.setAttribute("aria-label", m.alt);

}

const menuBtn = document.getElementById("menuBtn"), navEl = document.getElementById("nav");

/* reveal (Custom content effect of panels on scroll, the phone's behaviour): hidden only with IO and full motion */
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let revealIO = null;

  document.documentElement.classList.add("armed");
  revealIO = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); revealIO.unobserve(e.target); } }), { threshold: 0.15 });
}

    if (r.top < innerHeight && r.bottom > 0) p.classList.add("in"); else revealIO.observe(p);

}

/* пирамида-подсказка на каждом слайде, ведёт к следующему (на десктопе — через контроллер слайдов) */
{
  const slides = [...document.querySelectorAll(".slide")];
  slides.forEach((sl, i) => {
    if (i === slides.length - 1) return;

/* активный раздел + счётчик: от текущего слайда (центр экрана на телефоне, контроллер на десктопе) */
const counter = document.getElementById("counter"), cName = document.getElementById("cName"), cNum = document.getElementById("cNum");
const links = [...navEl.querySelectorAll("a[data-id]")];
function syncUI(slide) {
  if (!slide) return;
  const cur = slide.closest("#page > section")?.id;
  links.forEach(a => a.classList.toggle("on", a.dataset.id === cur));
  document.body.classList.remove("astral-on");
  if (slide.classList.contains("panel")) {
    const s = SECTORS.find(x => x.id === slide.dataset.sector);
    cName.textContent = s.en; cNum.textContent = String(slide.dataset.k).padStart(2, "0") + " / " + String(slide.dataset.total).padStart(2, "0");
    counter.hidden = false;
  } else counter.hidden = true;
}
function slideAtCenter() {
  const mid = innerHeight / 2;
  return [...document.querySelectorAll(".slide")].find(sl => { const r = sl.getBoundingClientRect(); return r.top <= mid && r.bottom > mid; }) || document.querySelector(".slide");
}
let ticking = false;
function update() { ticking = false; if (window.OH.deck?.active) return; const sl = slideAtCenter(); window.OH.current = sl; syncUI(sl); document.dispatchEvent(new CustomEvent("oh:slide", { detail: sl })); }

/* hooks for the motion bundle (slide controller, content effects, Motion Lab) */
